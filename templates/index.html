<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモ管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .search-box {
            margin-bottom: 30px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .memo-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }
        
        .memo-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .memo-content {
            color: #666;
            margin-bottom: 8px;
        }
        
        .memo-tags {
            color: #667eea;
            font-size: 14px;
        }
        
        .memo-date {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .count {
            color: #999;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 メモ管理</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="検索キーワードを入力">
            <input type="text" id="tagInput" placeholder="タグで絞り込み">
            <button onclick="searchMemos()">🔍 検索</button>
            <button onclick="loadAllMemos()">📋 全て表示</button>
        </div>
        
        <div class="count" id="count"></div>
        
        <div id="memos"></div>
    </div>
    
    <script>
        function loadAllMemos() {
            document.getElementById('searchInput').value = '';
            document.getElementById('tagInput').value = '';
            searchMemos();
        }
        
        function searchMemos() {
            const search = document.getElementById('searchInput').value;
            const tag = document.getElementById('tagInput').value;
            
            let url = '/memos';
            const params = [];
            
            if (search) params.push(`search=${encodeURIComponent(search)}`);
            if (tag) params.push(`tag=${encodeURIComponent(tag)}`);
            
            if (params.length > 0) {
                url += '?' + params.join('&');
            }
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const memosDiv = document.getElementById('memos');
                    const countDiv = document.getElementById('count');
                    
                    countDiv.textContent = `${data.count}件のメモ`;
                    
                    if (data.memos.length === 0) {
                        memosDiv.innerHTML = '<p>メモが見つかりませんでした</p>';
                        return;
                    }
                    
                    memosDiv.innerHTML = data.memos.map(memo => `
                        <div class="memo-item">
                            <div class="memo-title">${memo.title}</div>
                            <div class="memo-content">${memo.content}</div>
                            <div class="memo-tags">🏷️ ${memo.tags || 'タグなし'}</div>
                            <div class="memo-date">作成: ${memo.created_at}</div>
                        </div>
                    `).join('');
                });
        }
        
        // ページ読み込み時に全メモを表示
        loadAllMemos();
    </script>
</body>
</html>
